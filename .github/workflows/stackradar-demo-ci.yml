name: StackRadar Demo CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackradar-demo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: StackRadar Demo CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345 # 8.4.9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: kimai
          MYSQL_DATABASE: kimai
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      DATABASE_URL: mysql://root:kimai@127.0.0.1:3306/kimai?charset=utf8mb4&serverVersion=8.0.35
      MAILER_URL: null://localhost
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: ctype, gd, iconv, intl, ldap, mbstring, mysql, xml, xsl, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-all --no-interaction

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run the full test suite
        run: composer tests

      - name: Run static analysis
        run: composer phpstan

      - name: Run project linting
        run: composer linting

      - name: Audit locked dependencies
        run: composer audit --abandoned=report
